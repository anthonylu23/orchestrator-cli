# China VM integration fixture. Tianyi ECS client/runtime coverage is
# code-ready, but live endpoint and response shape verification is pending.
job:
  name: china-tianyi-vm-smoke
  image: registry.ctyun.cn/example/switchboard-smoke:latest
  command: ["python", "/app/train.py"]
  args: ["--train-data", "oos://my-bucket/switchboard-smoke/train"]
  env:
    SWITCHBOARD_INPUT_URI: oos://my-bucket/switchboard-smoke/train

china_cloud:
  common:
    ssh_user: root
    ssh_key_name: switchboard-smoke
    ssh_private_key: ~/.ssh/switchboard-china-smoke
    poll_interval_seconds: 30
    ssh_connect_timeout_seconds: 10
    ssh_ready_timeout_seconds: 600
    terminate_on_completion: true
    keep_instance_on_failure: false
  tianyi_cloud:
    endpoint: https://ctecs-global.ctapi.ctyun.cn
    region: huadong1
    zone: az1
    instance_type: s3.large.2
    image_id: img-00000000
    vpc_id: vpc-00000000
    subnet_id: subnet-00000000
    security_group_id: sg-00000000
    system_disk_category: SAS
    system_disk_size_gb: 80
    internet_bandwidth_mbps: 10
    estimate_hourly_usd: 2.50
