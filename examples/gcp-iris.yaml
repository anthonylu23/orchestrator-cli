job:
  name: "gcp-iris-pytorch-demo"
  image: "us-central1-docker.pkg.dev/my-project/switchboard/iris-pytorch:latest"
  args:
    - "--data-uri"
    - "gs://my-bucket/switchboard-demo/iris/Iris.csv"
    - "--epochs"
    - "40"

data:
  inputs:
    - name: "iris"
      source: "gs://my-bucket/switchboard-demo/iris/Iris.csv"
      mode: "uri"

gcp:
  project_id: "my-project"
  location: "us-central1"
  output_uri_prefix: "gs://my-bucket/switchboard-outputs"
  machine_type: "n1-standard-4"
  boot_disk_type: "pd-ssd"
  boot_disk_size_gb: 100
  estimate_hourly_usd: 0.25
