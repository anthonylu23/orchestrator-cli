# China VM integration fixture. Tencent CVM client/runtime coverage is
# code-ready, but live verification is pending the China colleague smoke.
job:
  name: china-tencent-vm-smoke
  image: ccr.ccs.tencentyun.com/example/switchboard-smoke:latest
  command: ["python", "/app/train.py"]
  args: ["--train-data", "cos://my-bucket-1250000000/switchboard-smoke/train"]
  env:
    SWITCHBOARD_INPUT_URI: cos://my-bucket-1250000000/switchboard-smoke/train

china_cloud:
  common:
    ssh_user: root
    ssh_key_name: switchboard-smoke
    ssh_private_key: ~/.ssh/switchboard-china-smoke
    poll_interval_seconds: 30
    ssh_connect_timeout_seconds: 10
    ssh_ready_timeout_seconds: 600
    terminate_on_completion: true
    keep_instance_on_failure: false
  tencent_cloud:
    endpoint: https://cvm.tencentcloudapi.com/
    region: ap-guangzhou
    zone: ap-guangzhou-7
    instance_type: S5.MEDIUM2
    image_id: img-00000000
    vpc_id: vpc-00000000
    subnet_id: subnet-00000000
    security_group_id: sg-00000000
    system_disk_category: CLOUD_PREMIUM
    system_disk_size_gb: 80
    internet_bandwidth_mbps: 10
    estimate_hourly_usd: 2.50
